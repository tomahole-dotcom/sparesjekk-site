name: Revenue Engine PR QA

on:
  push:
    branches: [revenue-engine-pass-1-20260915]
    paths:
      - '.github/workflows/revenue-engine-pr-qa.yml'

# qa trigger: 2026-09-15 revenue pass 1
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Snapshot protected SEO fields
        run: python tools/seo_guard.py snapshot
      - name: Build site with Revenue Engine
        run: python tools/build_site.py
      - name: Verify Revenue Engine routes
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          routes={
            'boliglanskalkulator-renteforskjell.html':'sjekk/boliglan/',
            'min-rente-vs-markedet.html':'sjekk/boliglan/',
            'bankbytte-break-even.html':'sjekk/boliglan/',
            'bytte-bank-boliglan-komplett.html':'sjekk/boliglan/',
            'guide-forhandle-rente.html':'sjekk/boliglan/',
            'boliglansrente-komplett-guide.html':'sjekk/boliglan/',
            'refinansiering-kalkulator.html':'sjekk/forbrukslan/',
            'gjeldsmiks-sjekk.html':'sjekk/forbrukslan/',
            'refinansiere-forbruksgjeld.html':'sjekk/forbrukslan/',
            'samle-smalan-kredittkortgjeld.html':'sjekk/forbrukslan/',
            'guide-refinansiering.html':'sjekk/forbrukslan/',
            'omstartslan.html':'sjekk/omstartslan/',
            'refinansiering-med-sikkerhet.html':'sjekk/omstartslan/',
          }
          for file,href in routes.items():
            soup=BeautifulSoup(Path(file).read_text(encoding='utf-8'),'html.parser')
            block=soup.select_one('.revenue-next-step')
            assert block, f'Missing revenue block: {file}'
            a=block.find('a',href=href)
            assert a, f'Missing expected route {href}: {file}'
            assert a.get('data-revenue-event')=='commercial_route', f'Missing event marker: {file}'
            assert 'ANNONSE / REKLAME' in block.get_text(' ',strip=True), f'Missing disclosure: {file}'
          print('Revenue routes verified:',len(routes))
          PY
      - name: Verify active partner routing
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          expected={
            'sjekk/boliglan/index.html':['1578043389'],
            'sjekk/forbrukslan/index.html':['1638602458','1578043594'],
            'sjekk/omstartslan/index.html':['1578044122'],
          }
          for file,ids in expected.items():
            soup=BeautifulSoup(Path(file).read_text(encoding='utf-8'),'html.parser')
            hrefs=' '.join(a.get('href','') for a in soup.select('a.partner-cta'))
            for i in ids: assert i in hrefs, f'Missing partner id {i}: {file}'
            for a in soup.select('a.partner-cta'):
              assert a.get('data-revenue-event')=='partner_click'
              assert 'sponsored' in a.get('rel',[])
          all_html=' '.join(Path(p).read_text(encoding='utf-8') for p in expected)
          assert '1578043798' not in all_html, 'Held vehicle-loan partner leaked into active landings'
          print('Partner routing verified')
          PY
      - name: Verify protected SEO fields
        run: python tools/seo_guard.py snapshot
      - name: Full site QA
        run: python tools/qa_site.py
