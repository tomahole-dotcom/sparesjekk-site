name: Revenue Engine Pass 6 QA
on:
  push:
    branches: [revenue-engine-pass-6-20260916]
    paths: ['.github/workflows/revenue-engine-pass-6-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO
        run: python tools/seo_guard.py snapshot
      - name: Build and apply Revenue layers
        run: |
          python tools/build_site.py
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
          python tools/apply_revenue_matcher.py
          python tools/apply_revenue_tracking.py
      - name: Verify matcher UX and safe routing
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          expected={'sjekk/forbrukslan/index.html':(3,4),'sjekk/omstartslan/index.html':(4,4)}
          for page,(choices,partners) in expected.items():
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              root=s.select_one('[data-revenue-matcher="v1"]'); assert root,page
              bs=root.select('button[data-match][data-revenue-event="matcher_choice"]'); assert len(bs)==choices,(page,len(bs))
              cards=s.select('.partner-preview .partner-card[data-partner]'); assert len(cards)==partners,(page,len(cards))
              for c in cards:
                  a=c.select_one('a.partner-cta[data-revenue-event="partner_click"]'); assert a,(page,c.get('data-partner'))
                  assert {'sponsored','nofollow','noopener'} <= set(a.get('rel') or [])
              script=s.find('script',attrs={'data-revenue-matcher-script':'v1'}); assert script,page
              assert 'scrollIntoView' in (script.string or '') and 'data-rank-' in (script.string or ''),page
              tracking=s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'}); assert tracking and 'revenue_context' in (tracking.string or ''),page
          print('Pass 6 matcher UX PASS')
      - name: SEO guard
        run: python tools/seo_guard.py snapshot
      - name: Full site QA
        run: python tools/qa_site.py
