name: Credit Card Route QA 20260917

on:
  push:
    branches: [traffic-conversion-quickwins-20260917]
    paths:
      - 'site-config.json'
      - '.github/workflows/credit-card-route-qa-20260917.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Build
        run: python tools/build_site.py
      - name: Verify credit card partner route
        shell: python
        run: |
          from pathlib import Path
          import json
          cfg=json.loads(Path('site-config.json').read_text(encoding='utf-8'))
          z=next(p for p in cfg['partners'] if p['name']=='Zensum')
          assert z['approved'] is True
          assert z['status']=='active'
          assert z['tracking_verified'] is True
          assert 'kredittkort' in z['categories']
          s=Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8')
          assert 'data-partner="Zensum"' in s
          assert 'ANNONSE / REKLAME' in s
          assert 'sponsored' in s and 'nofollow' in s and 'noopener' in s
          print('Credit card route PASS')
      - name: SEO guard
        run: python tools/seo_guard.py check
      - name: Full QA
        run: python tools/qa_site.py
