name: Render Rentemote Short V2
on:
  workflow_dispatch:
  push:
    branches: [seo-content-v34-master]
    paths:
      - 'tools/render_rentemote_video.py'
      - '.github/workflows/render-rentemote-short-v2.yml'
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Render scene-based vertical MP4
        run: python tools/render_rentemote_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: rentemote-short-v2-mp4
          path: rendered/rentemote-short-v2.mp4
          retention-days: 14
