name: Revenue Engine Pass 4 Production
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/revenue-engine-pass-4-production.yml']
permissions:
  contents: write
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Apply refinance result CTA
        run: python tools/apply_revenue_conversion.py
      - name: Apply mortgage result CTA
        run: python tools/apply_mortgage_result_revenue_cta.py
      - name: Verify result CTAs
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          r=BeautifulSoup(Path('refinansiering-kalkulator.html').read_text(encoding='utf-8'),'html.parser')
          assert r.select_one('#offerNext .result-commercial-cta a[data-revenue-context="refinance_calculator_result"][href="sjekk/forbrukslan/"]')
          m=BeautifulSoup(Path('boliglanskalkulator-renteforskjell.html').read_text(encoding='utf-8'),'html.parser')
          box=m.select_one('.mortgage-result-commercial-cta')
          assert box and box.has_attr('hidden')
          assert box.select_one('a[data-revenue-context="mortgage_rate_calculator_result"][href="sjekk/boliglan/"]')
          assert 'ANNONSE / REKLAME' in box.get_text(' ',strip=True)
          assert m.find('script',attrs={'data-revenue-result-reveal':'mortgage-v1'})
          print('Result CTA verification PASS')
      - name: Apply Revenue tracking
        run: python tools/apply_revenue_tracking.py
      - name: Verify Revenue tracking
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          pages=[]
          for p in Path('.').rglob('*.html'):
              if 'tools' in p.parts: continue
              s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              if s.select_one('[data-revenue-event]'):
                  pages.append(p)
                  assert s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'}),p
          assert len(pages)>=16
          print('Revenue tracking PASS',len(pages))
      - name: SEO guard
        run: python tools/seo_guard.py snapshot
      - name: Full site QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          assert not [str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert 'https://sparesjekk.no/boliglanskalkulator-renteforskjell.html' in Path('sitemap.xml').read_text(encoding='utf-8')
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Revenue Engine pass 4 generated outputs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
