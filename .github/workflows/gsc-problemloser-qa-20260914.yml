name: GSC Problemloser QA 20260914

on:
  pull_request:
    branches: [seo-content-v34-master]
    paths:
      - 'tools/build_site.py'
      - '.github/workflows/gsc-problemloser-qa-20260914.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Verify Problemloser discovery route
        shell: python
        run: |
          from pathlib import Path
          s=Path('guider.html').read_text(encoding='utf-8')
          assert 'href="problemloser.html"' in s
          for token in ['<title>Alle guider | Sparesjekk</title>','https://sparesjekk.no/guider.html','<h1>Alle guider på Sparesjekk</h1>']:
              assert token in s, token
          print('Problemloser discovery + protected guider fields PASS')
      - name: Full QA
        run: python tools/qa_site.py
