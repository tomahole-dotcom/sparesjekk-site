name: GSC Opportunity Batch QA 20260914

on:
  push:
    branches: [gsc-rentemote-opportunity-20260914]
    paths: ['.github/workflows/gsc-opportunity-batch-qa-20260914.yml']

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify batch scope
        shell: python
        run: |
          from pathlib import Path
          pages=['rentemote-hva-betyr-det.html','refinansiere-forbruksgjeld.html','guide-belaningsgrad.html','medlantaker-boliglan.html']
          for page in pages:
              s=Path(page).read_text(encoding='utf-8')
              assert '<title>' in s,page
              assert 'name="description"' in s,page
              assert 'rel="canonical"' in s,page
              assert 'name="robots"' in s,page
              assert '<h1' in s,page
              assert 'G-XYRPP78DJ5' in s,page
          assert '24. september 2026' in Path('rentemote-hva-betyr-det.html').read_text(encoding='utf-8')
          assert 'Hva er forbruksgjeld?' in Path('refinansiere-forbruksgjeld.html').read_text(encoding='utf-8')
          assert 'belaningsgrad-sjekk.html' in Path('guide-belaningsgrad.html').read_text(encoding='utf-8')
          med=Path('medlantaker-boliglan.html').read_text(encoding='utf-8')
          assert med.count('<h2>Medlåntaker kontra kausjonist</h2>') == 1
          assert med.count('<h2>Hva er en medlåntaker?</h2>') == 1
          assert 'hvor-mye-kan-jeg-lane-bolig.html' in med
          print('Batch-specific checks PASS')
      - name: Full SEO guard
        run: python tools/seo_guard.py check
      - name: Full site QA
        run: python tools/qa_site.py
      - name: Verify build preserves batch
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable,'tools/build_site.py'],check=True)
          subprocess.run([sys.executable,'tools/seo_guard.py','check'],check=True)
          subprocess.run([sys.executable,'tools/qa_site.py'],check=True)
          checks={
            'rentemote-hva-betyr-det.html':['24. september 2026','boliglanskalkulator-renteforskjell.html'],
            'refinansiere-forbruksgjeld.html':['Hva er forbruksgjeld?','gjeldsmiks-sjekk.html','tilbudssjekk-refinansiering.html'],
            'guide-belaningsgrad.html':['belaningsgrad-sjekk.html','min-rente-vs-markedet.html'],
            'medlantaker-boliglan.html':['Hva er en medlåntaker?','kausjonist-boliglan.html','hvor-mye-kan-jeg-lane-bolig.html']
          }
          for page,tokens in checks.items():
              s=Path(page).read_text(encoding='utf-8')
              for token in tokens:
                  assert token in s,(page,token)
          med=Path('medlantaker-boliglan.html').read_text(encoding='utf-8')
          assert med.count('<h2>Hva er en medlåntaker?</h2>') == 1
          print('Post-build batch preservation PASS')
