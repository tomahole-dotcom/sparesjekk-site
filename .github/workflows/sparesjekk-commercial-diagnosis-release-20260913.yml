name: Sparesjekk V45 GSC Internal Link Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V45 GSC internal-link QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify GSC priority-link source
        shell: python
        run: |
          from pathlib import Path
          b=Path('tools/build_site.py').read_text(encoding='utf-8')
          for token in ['apply_priority_internal_links','boliglan-uten-egenkapital.html','egenkapital-bolig.html','hvor-mye-kan-jeg-lane-bolig.html','bytte-bank-boliglan-komplett.html','guide-effektiv-nominell-rente.html','problemloser.html','medlantaker-boliglan.html','boliglansrente-komplett-guide.html','gsc-20260913']:
              assert token in b, token
          print('GSC priority-link source PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Apply result-driven Revenue CTAs
        run: |
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
      - name: Verify result-driven Revenue CTAs
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          checks=[
            ('refinansiering-kalkulator.html','#offerNext .result-commercial-cta a','sjekk/forbrukslan/','refinance_calculator_result'),
            ('gjeldsmiks-sjekk.html','#result #commercialCta','sjekk/forbrukslan/','debt_mix_result'),
            ('min-rente-vs-markedet.html','#result #commercialCta','sjekk/boliglan/','mortgage_rate_benchmark_result'),
          ]
          for page,sel,href,ctx in checks:
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              c=s.select_one(sel); assert c,(page,sel)
              assert c.get('href')==href,(page,c.get('href'))
              assert c.get('data-revenue-event')=='commercial_route',page
              assert c.get('data-revenue-context')==ctx,(page,c.get('data-revenue-context'))
          m=BeautifulSoup(Path('boliglanskalkulator-renteforskjell.html').read_text(encoding='utf-8'),'html.parser')
          assert m.select_one('.mortgage-result-commercial-cta a[data-revenue-context="mortgage_rate_calculator_result"]')
          print('Result-driven Revenue CTAs PASS')
      - name: Apply Revenue Engine GA4 tracking
        run: python tools/apply_revenue_tracking.py
      - name: Verify Revenue Engine tracking and partner matrix
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          pages=[]
          for p in Path('.').rglob('*.html'):
              if 'tools' in p.parts: continue
              s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              if s.select_one('[data-revenue-event]'):
                  pages.append(p)
                  tag=s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'}); assert tag,p
                  assert 'revenue_context' in (tag.string or ''),p
          assert len(pages)>=16,len(pages)
          expected={
            'sjekk/forbrukslan/index.html':{
              'Zensum':'https://go.adt256.com/t/t?a=1638602458&as=2102543040&t=2&tk=1',
              'Sambla':'https://go.adt246.net/t/t?a=1923319888&as=2102543040&t=2&tk=1',
              'DigiFinans':'https://go.adt231.net/t/t?a=1923321285&as=2102543040&t=2&tk=1',
              'Tjenestetorget':'https://go.adt253.net/t/t?a=1578043594&as=2102543040&t=2&tk=1'},
            'sjekk/omstartslan/index.html':{
              'Okida':'https://at.okida.no/t/t?a=1259715125&as=2102543040&t=2&tk=1',
              'Zen Finans':'https://ion.zenfinans.no/t/t?a=2103897882&as=2102543040&t=2&tk=1',
              'GjeldsMegleren Norge':'https://at.gjeldsmeglerennorge.no/t/t?a=2069312844&as=2102543040&t=2&tk=1',
              'Tjenestetorget':'https://go.adt253.net/t/t?a=1578044122&as=2102543040&t=2&tk=1'}}
          for page,partners in expected.items():
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              cards={c.get('data-partner'):c for c in s.select('.partner-card')}
              assert set(cards)==set(partners),(page,set(cards),set(partners))
              for name,url in partners.items():
                  a=cards[name].select_one('a.partner-cta'); assert a
                  assert a.get('href')==url,(page,name,a.get('href'))
                  assert a.get('data-revenue-event')=='partner_click'
                  assert a.get('data-revenue-partner')==name
                  assert {'sponsored','nofollow','noopener'} <= set(a.get('rel') or [])
          print('Revenue tracking + approved partner matrix PASS:',len(pages),'instrumented pages')
      - name: Verify priority links after build
        shell: python
        run: |
          from pathlib import Path
          checks={
            'boliglan.html':['boliglan-uten-egenkapital.html','egenkapital-bolig.html','hvor-mye-kan-jeg-lane-bolig.html','bytte-bank-boliglan-komplett.html','medlantaker-boliglan.html','boliglansrente-komplett-guide.html'],
            'boliglan-guider.html':['boliglan-uten-egenkapital.html','egenkapital-bolig.html'],
            'egenkapital-bolig.html':['boliglan-uten-egenkapital.html','hvor-mye-kan-jeg-lane-bolig.html'],
            'hvor-mye-kan-jeg-lane-bolig.html':['medlantaker-boliglan.html'],
            'flytte-boliglan.html':['bytte-bank-boliglan-komplett.html'],
            'forbrukslan.html':['guide-effektiv-nominell-rente.html','refinansiere-forbruksgjeld.html'],
            'guide-rente-forhandle.html':['rentemote-hva-betyr-det.html'],
            'guide-forhandle-rente.html':['boliglansrente-komplett-guide.html'],
            'refinansiere-forbruksgjeld.html':['guide-effektiv-nominell-rente.html','gjeldsmiks-sjekk.html','refinansiering-kalkulator.html','tilbudssjekk-refinansiering.html'],
            'bytte-bank-boliglan-komplett.html':['min-rente-vs-markedet.html','boliglanskalkulator-renteforskjell.html','bankbytte-break-even.html','sjekk/boliglan/'],
            'cashback-bonus-kredittkort.html':['kredittkort-match.html','sjekk/kredittkort/'],
            'effektiv-rente-forbrukslan.html':['sammenligne-forbrukslan.html','sjekk/forbrukslan/','refinansiere-forbruksgjeld.html'],
            'guider.html':['problemloser.html'],
          }
          for page,targets in checks.items():
              s=Path(page).read_text(encoding='utf-8')
              for target in targets: assert target in s,(page,target)
          print('Priority + commercial routing links PASS')
      - name: Verify protected SEO fields
        shell: python
        run: |
          from pathlib import Path
          for page in ['boliglan-uten-egenkapital.html','egenkapital-bolig.html','hvor-mye-kan-jeg-lane-bolig.html','bytte-bank-boliglan-komplett.html','guide-effektiv-nominell-rente.html','refinansiere-forbruksgjeld.html','cashback-bonus-kredittkort.html','effektiv-rente-forbrukslan.html','guider.html','medlantaker-boliglan.html','guide-rente-forhandle.html','guide-forhandle-rente.html','forbrukslan.html','boliglansrente-komplett-guide.html']:
              s=Path(page).read_text(encoding='utf-8')
              for token in ['rel="canonical"','robots']:
                  assert token in s,(page,token)
              assert '<h1' in s,page
          print('Protected SEO fields present PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          assert not [str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for url in ['https://sparesjekk.no/boliglan-uten-egenkapital.html','https://sparesjekk.no/egenkapital-bolig.html','https://sparesjekk.no/hvor-mye-kan-jeg-lane-bolig.html','https://sparesjekk.no/bytte-bank-boliglan-komplett.html','https://sparesjekk.no/guide-effektiv-nominell-rente.html','https://sparesjekk.no/refinansiere-forbruksgjeld.html','https://sparesjekk.no/cashback-bonus-kredittkort.html','https://sparesjekk.no/effektiv-rente-forbrukslan.html','https://sparesjekk.no/problemloser.html','https://sparesjekk.no/medlantaker-boliglan.html','https://sparesjekk.no/rentemote-hva-betyr-det.html','https://sparesjekk.no/boliglansrente-komplett-guide.html']:
              assert url in sm,url
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Revenue Engine pass 5 generated outputs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**

# release trigger: Revenue Engine pass 5 partner matrix + result context 2026-09-16
