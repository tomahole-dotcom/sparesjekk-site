name: Sparesjekk V43 Mobile Tools Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V43 mobile tools QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify V43 mobile tools layer
        shell: python
        run: |
          from pathlib import Path
          css=Path('design-v43.css').read_text(encoding='utf-8')
          for token in ['mobile QA repairs for interactive tools','.tool-card .debt-row','.offer-grid','.match .q select','.match .btn']:
              assert token in css, token
          builder=Path('tools/build_site.py').read_text(encoding='utf-8')
          assert "'design-v43.css'" in builder
          print('V43 presentation PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build presentation layers
        run: python tools/build_site.py
      - name: Verify V43 on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          pages=[p for p in Path('.').rglob('*.html') if not any(part.startswith('.') for part in p.parts) and 'tools' not in p.parts]
          missing=[str(p) for p in pages if 'design-v43.css' not in p.read_text(encoding='utf-8')]
          assert not missing, missing[:25]
          print(f'V43 applied to {len(pages)} pages')
      - name: Verify tool functionality and SEO preserved
        shell: python
        run: |
          from pathlib import Path
          checks={
            'gjeldsmiks-sjekk.html':['Analyser gjelden','debt_mix_complete','WebApplication','rel="canonical"'],
            'refinansiering-kalkulator.html':['Sammenlign før og etter','Lavere per måned – men dyrere totalt.','WebApplication','rel="canonical"'],
            'kredittkort-match.html':['Finn hva jeg bør prioritere','credit_card_match_complete','WebApplication','rel="canonical"']
          }
          for fn,tokens in checks.items():
              s=Path(fn).read_text(encoding='utf-8')
              for token in tokens: assert token in s,(fn,token)
              assert 'robots' in s,(fn,'robots')
          print('Priority tools functionality + SEO preserved PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          assert not [str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for url in ['gjeldsmiks-sjekk.html','refinansiering-kalkulator.html','kredittkort-match.html']:
              assert 'https://sparesjekk.no/'+url in sm,url
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply V43 mobile tool QA repairs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
