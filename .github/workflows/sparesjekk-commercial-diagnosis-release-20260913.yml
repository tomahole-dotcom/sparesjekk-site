name: Sparesjekk V44 Refinancing Offer Checker Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V44 refinancing offer checker QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify offer checker source
        shell: python
        run: |
          from pathlib import Path
          p=Path('tilbudssjekk-refinansiering.html')
          assert p.exists()
          s=p.read_text(encoding='utf-8')
          for token in ['Er refinansieringstilbudet faktisk bedre?','Sjekk tilbudet','Samlet restgjeld (kr)','Tilbudt effektiv rente (%)','Ny løpetid (måneder)','Etableringsgebyr (kr)','Månedsgebyr (kr)','refi_offer_check_complete','WebApplication','rel="canonical"','robots']:
              assert token in s, token
          assert not Path('tilbudssjekken.html').exists(), 'duplicate offer checker must not exist'
          builder=Path('tools/build_site.py').read_text(encoding='utf-8')
          assert "tilbudssjekk-refinansiering.html" in builder
          print('Offer checker source + canonical route PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Verify design layer and offer checker after build
        shell: python
        run: |
          from pathlib import Path
          s=Path('tilbudssjekk-refinansiering.html').read_text(encoding='utf-8')
          for token in ['design-v43.css','Er refinansieringstilbudet faktisk bedre?','Sjekk tilbudet','refi_offer_check_complete','rel="canonical"','WebApplication','Tilbudssjekken']:
              assert token in s,token
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts and not any(part.startswith('.') for part in p.parts)]
          nav_pages=[p for p in pages if 'class="topnav"' in p.read_text(encoding='utf-8')]
          missing=[str(p) for p in nav_pages if 'Tilbudssjekken' not in p.read_text(encoding='utf-8')]
          assert not missing, missing[:20]
          print(f'Offer checker + navigation PASS on {len(nav_pages)} nav pages')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          s=Path('tilbudssjekk-refinansiering.html').read_text(encoding='utf-8')
          assert ga4 in s
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://sparesjekk.no/tilbudssjekk-refinansiering.html' in sm
          assert 'https://sparesjekk.no/tilbudssjekken.html' not in sm
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Release refinancing offer checker'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
