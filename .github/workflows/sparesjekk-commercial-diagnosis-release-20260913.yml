name: Sparesjekk V36 Brand Rollout 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V36 brand rollout QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify V36 brand assets
        shell: python
        run: |
          from pathlib import Path
          css=Path('design-v36.css').read_text(encoding='utf-8')
          logo=Path('assets/sparesjekk-logo-blue.svg').read_text(encoding='utf-8')
          for token in ['--brand:#0A66E8','sparesjekk-logo-blue.svg','.topic-card:nth-child(1) .topic-icon','.header','.logo']:
              assert token in css, token
          assert 'Sparesjekk' in logo and 'Mer penger. Enklere valg.' in logo
          print('V36 blue brand assets PASS')
      - name: Build V36 across all HTML
        run: |
          python tools/seo_guard.py snapshot
          python tools/build_site.py
          python tools/seo_guard.py snapshot
      - name: Verify V36 is on every page
        shell: python
        run: |
          from pathlib import Path
          pages=[p for p in Path('.').rglob('*.html') if not any(part.startswith('.') for part in p.parts) and 'tools' not in p.parts]
          missing=[]; legacy=[]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if 'design-v36.css' not in s: missing.append(str(p))
              if 'design-v35.css' in s or 'design-v34.css' in s: legacy.append(str(p))
          assert not missing, ('Missing V36',missing[:20])
          assert not legacy, ('Legacy design links',legacy[:20])
          print(f'V36 applied to {len(pages)} HTML pages')
      - name: Verify homepage and key conversion paths
        shell: python
        run: |
          from pathlib import Path
          home=Path('index.html').read_text(encoding='utf-8')
          debt=Path('gjeldsmiks-sjekk.html').read_text(encoding='utf-8')
          card=Path('kredittkort-match.html').read_text(encoding='utf-8')
          for x in ['class="visual-hero"','class="topic-grid"','Sjekk økonomien din','gjeldsmiks-sjekk.html','kredittkort-match.html']:
              assert x in home, x
          assert 'Hva kan lavere rente bety?' in debt
          assert 'Hvilket kredittkort passer måten du bruker kort på?' in card
          print('Homepage + conversion paths PASS')
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=list(Path('.').rglob('*.html'))
          missing=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing, missing
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for u in ['gjeldsmiks-sjekk.html','kredittkort-match.html','forbrukslan.html','kredittkort.html']:
              assert 'https://sparesjekk.no/'+u in sm, u
          print(f'GA4 + sitemap PASS: {len(pages)} pages')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply V36 brand system across site'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
