name: Sparesjekk V40-V41 Homepage Visual Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V40-V41 homepage visual QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify V40-V41 presentation layers
        shell: python
        run: |
          from pathlib import Path
          v40=Path('design-v40.css').read_text(encoding='utf-8')
          v41=Path('design-v41.css').read_text(encoding='utf-8')
          for token in ['placeholder-like homepage card visuals','#start .topic-card','#start .topic-visual']:
              assert token in v40, token
          for token in ['compact homepage polish','.visual-hero','.tool-grid .tool-card','.home-calc']:
              assert token in v41, token
          builder=Path('tools/build_site.py').read_text(encoding='utf-8')
          assert "design_names=['design-v36.css','design-v37.css','design-v38.css','design-v39.css','design-v40.css','design-v41.css']" in builder
          print('V40-V41 presentation PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build presentation layers
        run: python tools/build_site.py
      - name: Verify design layers on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          layers=['design-v36.css','design-v37.css','design-v38.css','design-v39.css','design-v40.css','design-v41.css']
          pages=[p for p in Path('.').rglob('*.html') if not any(part.startswith('.') for part in p.parts) and 'tools' not in p.parts]
          missing=[]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if not all(x in s for x in layers): missing.append(str(p))
          assert not missing, missing[:25]
          print(f'V36-V41 applied to {len(pages)} pages')
      - name: Verify homepage SEO and routing content preserved
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for token in ['Få bedre kontroll på pengene dine','Hva vil du sjekke?','Sjekk boliglånet','Sjekk gjelden','Finn riktig kortprofil','rel="canonical"','robots','application/ld+json']:
              assert token in s, token
          print('Homepage content + SEO preserved PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          missing_ga=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing_ga, missing_ga[:20]
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://sparesjekk.no/' in sm
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply V40-V41 homepage visual layers'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
