name: Sparesjekk V38 Priority Tool Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V38 priority-tool QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify V38 presentation layer
        shell: python
        run: |
          from pathlib import Path
          css=Path('design-v38.css').read_text(encoding='utf-8')
          for token in ['conversion-focused presentation','.rate-tool','.match','.tool-shell']:
              assert token in css, token
          builder=Path('tools/build_site.py').read_text(encoding='utf-8')
          assert "design_names=['design-v36.css','design-v37.css','design-v38.css']" in builder
          print('V38 priority tool presentation PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build presentation layers
        run: python tools/build_site.py
      - name: Verify V38 on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          pages=[p for p in Path('.').rglob('*.html') if not any(part.startswith('.') for part in p.parts) and 'tools' not in p.parts]
          missing=[]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if not all(x in s for x in ['design-v36.css','design-v37.css','design-v38.css']):
                  missing.append(str(p))
          assert not missing, missing[:25]
          print(f'V36+V37+V38 applied to {len(pages)} pages')
      - name: Verify priority tool content and SEO preserved
        shell: python
        run: |
          from pathlib import Path
          checks={
            'min-rente-vs-markedet.html':['Ligger boliglånsrenten din over markedet?','SSB-referanse','rel="canonical"','robots'],
            'kredittkort-match.html':['Hvilket kredittkort passer måten du bruker kort på?','Dette bør du prioritere','rel="canonical"','robots'],
            'refinansiering-kalkulator.html':['Refinansiering kalkulator – før og etter','Hva gjør denne kalkulatoren annerledes?','rel="canonical"','robots'],
            'gjeldsmiks-sjekk.html':['Se gjeldsmiksen din – og hva lavere rente kan bety','Hva kan lavere rente bety?','rel="canonical"','robots'],
          }
          for f,tokens in checks.items():
              s=Path(f).read_text(encoding='utf-8')
              for token in tokens: assert token in s,(f,token)
          print('Priority tool content + canonical/robots preserved PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          missing_ga=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing_ga, missing_ga[:20]
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for u in ['min-rente-vs-markedet.html','kredittkort-match.html','refinansiering-kalkulator.html','gjeldsmiks-sjekk.html']:
              assert 'https://sparesjekk.no/'+u in sm, u
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply V38 priority-tool visual layer'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
