name: Sparesjekk V45 GSC Internal Link Release 20260913
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']
permissions:
  contents: write
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    if: startsWith(github.event.head_commit.message, 'RELEASE:') || contains(github.event.head_commit.message, 'Run V45 GSC internal-link QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Apply complete Revenue Engine 1-10 and Traffic Capture
        run: |
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
          python tools/apply_revenue_matcher.py
          python tools/apply_revenue_handoff.py
          python tools/apply_revenue_choice_ux.py
          python tools/apply_revenue_tracking.py
          python tools/apply_revenue_intent_attribution.py
          python tools/apply_revenue_sticky_cta.py
          python tools/apply_bank_switch_capture.py
          python tools/apply_rate_negotiation_capture.py
          python tools/apply_rate_negotiation_links.py
          python tools/apply_equity_gap_capture.py
          python tools/apply_debt_conversion_capture.py
          python tools/apply_conversion_capture_links.py
          python tools/apply_credit_debt_conversion_links.py
          python tools/apply_refinance_authority_batch.py
          python tools/apply_consumer_loan_authority_batch.py
          python tools/apply_mortgage_equity_authority_batch.py
          python tools/apply_credit_card_quickwin_batch.py
          python tools/apply_rate_authority_batch.py
          python tools/apply_housing_finance_intent_batch.py
          python tools/apply_debt_search_to_revenue_batch.py
          python tools/apply_borrowing_capacity_conversion_batch.py
          python tools/apply_bank_switch_consolidation_batch.py
          python tools/apply_equity_search_to_revenue_batch.py
          python tools/apply_rate_search_to_revenue_batch.py
          python tools/apply_secured_refi_search_to_revenue_batch.py
          python tools/apply_housing_product_conversion_batch.py
          python tools/apply_refi_ranking_conversion_batch.py
          python tools/apply_equity_ranking_batch.py
          python tools/apply_mortgage_cost_ranking_batch.py
          python tools/apply_bank_switch_ranking_batch.py
          python tools/apply_refinance_intent_ranking_batch.py
          python tools/apply_ltv_borrowing_ranking_batch.py
          python tools/apply_first_home_conversion_batch.py
          python tools/apply_consumer_loan_conversion_bridge.py
          python tools/apply_payment_relief_conversion_batch.py
          python tools/apply_unsecured_debt_conversion_bridge.py
          python tools/apply_commercial_ranking_links_batch.py
          python tools/apply_equity_cluster_authority_links.py
          python tools/apply_mortgage_move_query_ownership.py
          python tools/apply_debt_refi_authority_links.py
          python tools/apply_mortgage_rate_authority_links_v2.py
          python tools/apply_existing_mortgage_change_cluster.py
          python tools/apply_rate_meeting_conversion_bridge.py
          python tools/apply_rate_history_commercial_bridge.py
          python tools/apply_consumer_loan_early_repayment_cluster.py
          python tools/apply_bridge_financing_authority_cluster.py
          python tools/apply_fx_fee_credit_card_conversion.py
          python tools/apply_credit_card_debt_conversion_bridge.py
          python tools/apply_ltv_rate_decision_cluster_v2.py
          python tools/apply_payment_relief_authority_v2.py
          python tools/apply_mortgage_compare_intent_consolidation_v2.py
          python tools/apply_toploan_housing_intent.py
          python tools/apply_late_interest_calculator.py
          python tools/apply_recent_ui_design_qa.py
          python tools/apply_nominal_rate_cost_comparator.py
          python tools/apply_cash_withdrawal_cost_tool.py
          python tools/apply_borrowing_capacity_tool.py
          python tools/apply_interest_free_card_conversion.py
          python tools/apply_consumer_loan_early_intent.py
          python tools/apply_creditline_early_intent.py
          python tools/apply_consumer_hub_intent.py
          python tools/apply_restart_hub_intent.py
          python tools/apply_credit_card_hub_intent.py
          python tools/apply_credit_card_match_conversion.py
          python tools/apply_credit_card_commercial_cluster.py
          python tools/apply_mortgage_compare_early_conversion.py
          python tools/apply_credit_card_intent_attribution.py
          python tools/apply_credit_card_partner_clarity_v1.py
          python tools/apply_rentegap_conversion_privacy.py
          python tools/apply_fixed_vs_floating_break_even.py
          python tools/apply_ta_sparesjekken_v1.py
          python tools/apply_ta_sparesjekken_traffic_entry_v1.py
          python tools/apply_ta_sparesjekken_gsc_entry_v1.py
          python tools/apply_high_intent_handoff_v1.py
          python tools/apply_mortgage_matcher_handoff_v1.py
      - name: Verify Revenue Engine pass 10 and Traffic Engine batch
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          for page,n in [('sjekk/forbrukslan/index.html',3),('sjekk/omstartslan/index.html',4)]:
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              root=s.select_one('[data-revenue-matcher="v1"][data-allowed-intents]'); assert root,page
              assert len(root.select('button[data-match][data-revenue-event="matcher_choice"]'))==n,page
              assert s.find('script',attrs={'data-revenue-handoff-script':'v1'}),page
              assert s.find('script',attrs={'data-revenue-intent-attribution':'v1'}),page
              bar=s.select_one('[data-revenue-sticky="v1"]'); assert bar and bar.has_attr('hidden'),page
              a=bar.select_one('a[data-revenue-event="sticky_partner_click"][data-revenue-stage="partner_outclick"]'); assert a,page
              assert a.get('href')=='#partneralternativer',page
              assert not a.get('rel'),page
              js=s.find('script',attrs={'data-revenue-sticky-script':'v1'}); assert js,page
              code=js.string or ''
              for x in ['partner_click','revenuePartner','matcherIntent','revenueContext','setTimeout(sync,0)',"out.rel='sponsored nofollow noopener'"]: assert x in code,(page,x)
              t=s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'}); assert t and 'matcher_intent' in (t.string or ''),page
          p=Path('bor-jeg-bytte-bank.html'); assert p.exists()
          s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
          assert s.select_one('#bankSwitchCheck') and len(s.select('#bankSwitchCheck select'))==4
          assert s.select_one('#strongCta[data-revenue-event="commercial_route"]').get('href')=='sjekk/boliglan/'
          p=Path('banken-vil-ikke-senke-renten.html'); assert p.exists()
          s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
          assert s.select_one('#rateNegotiationCheck') and len(s.select('#rateNegotiationCheck select'))==3
          assert s.select_one('#compareCta[data-revenue-event="commercial_route"]').get('href')=='sjekk/boliglan/'
          assets=['embed/renteforskjell.html','bygg-inn-rentekalkulator.html','embed/gjeldsrente-sjekk.html','bygg-inn-gjeldsrente-sjekk.html','embed/valutapaslag.html','bygg-inn-valutapaslag-kalkulator.html','embed/kredittkort-minstebelop.html','bygg-inn-kredittkort-minstebelop.html','betalingsproblemer-hva-gjor-jeg.html','mangler-egenkapital-bolig.html','hva-bor-jeg-gjore-med-dyr-gjeld.html']
          for f in assets: assert Path(f).exists(),f
          for f in ['embed/renteforskjell.html','embed/gjeldsrente-sjekk.html','embed/valutapaslag.html','embed/kredittkort-minstebelop.html']:
              t=Path(f).read_text(encoding='utf-8').lower(); assert 'noindex' in t and 'sjekk/' not in t,f
          t=Path('betalingsproblemer-hva-gjor-jeg.html').read_text(encoding='utf-8')
          assert 'sjekk/omstartslan/?intent=utfordringer' in t
          eq=Path('mangler-egenkapital-bolig.html').read_text(encoding='utf-8')
          assert 'equity_gap_check_complete' in eq and 'data-revenue-context="equity_gap_security"' in eq
          debt=Path('hva-bor-jeg-gjore-med-dyr-gjeld.html').read_text(encoding='utf-8')
          assert 'debt_conversion_check_complete' in debt and 'sjekk/omstartslan/?intent=sikkerhet' in debt and 'sjekk/forbrukslan/?intent=refinansiere' in debt
          for source in ['boliglan-uten-egenkapital.html','kausjonist-boliglan.html','egenkapital-bolig.html']:
              assert 'mangler-egenkapital-bolig.html' in Path(source).read_text(encoding='utf-8'),source
          for source in ['refinansiere-forbruksgjeld.html','guide-refinansiering.html','gjeldsmiks-sjekk.html','samle-smalan-kredittkortgjeld.html']:
              assert 'hva-bor-jeg-gjore-med-dyr-gjeld.html' in Path(source).read_text(encoding='utf-8'),source
          for source in ['minimumsbetaling-kredittkort.html','nedbetaling-kredittkortgjeld.html','refinansiere-forbruksgjeld.html']:
              html=Path(source).read_text(encoding='utf-8')
              assert 'data-conversion-route="credit-debt-v1"' in html,source
              assert 'hva-bor-jeg-gjore-med-dyr-gjeld.html' in html,source
          overview=Path('gjeldsregisteret-forbrukslan.html').read_text(encoding='utf-8')
          assert 'data-debt-overview-next="v1"' in overview
          for route in ['gjeldsmiks-sjekk.html','hva-bor-jeg-gjore-med-dyr-gjeld.html','betalingsproblemer-hva-gjor-jeg.html']:
              assert route in overview,route
          for page,marker in [
              ('guide-refinansiering.html','data-refi-authority="definition-v1"'),
              ('refinansiering-med-sikkerhet.html','data-refi-authority="secured-v1"'),
              ('refinansiere-forbruksgjeld.html','data-refi-authority="consumer-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
          for page in ['forbrukslan.html','omstartslan.html','guider.html']:
              assert 'data-refi-authority-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('forbrukslan-komplett-guide.html','data-consumer-authority="definition-v1"'),
              ('effektiv-rente-forbrukslan.html','data-consumer-authority="compare-signal-v1"'),
              ('sammenligne-forbrukslan.html','data-consumer-authority="process-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
          for page in ['forbrukslan.html','forbrukslan-guider.html','guider.html']:
              assert 'data-consumer-authority-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('boliglan-uten-egenkapital.html','data-mortgage-equity="gap-v1"'),
              ('kausjonist-boliglan.html','data-mortgage-equity="guarantor-v1"'),
              ('medlantaker-boliglan.html','data-mortgage-equity="coborrower-v1"'),
              ('egenkapital-bolig.html','data-mortgage-equity="capital-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
          for page in ['boliglan.html','boliglan-guider.html','guider.html']:
              assert 'data-mortgage-equity-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('cashback-bonus-kredittkort.html','data-credit-quickwin="bonus-v1"'),
              ('minimumsbetaling-kredittkort.html','data-credit-quickwin="paydown-v1"'),
              ('valutapaslag-kredittkort.html','data-credit-quickwin="fx-v1"')]:
              assert marker in Path(page).read_text(encoding='utf-8'),(page,marker)
          for page in ['kredittkort.html','kredittkort-komplett-guide.html','kredittkort-guider.html']:
              assert 'data-credit-quickwin-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('boliglansrente-komplett-guide.html','data-rate-authority="mortgage-rate-v1"'),
              ('guide-effektiv-nominell-rente.html','data-rate-authority="nominal-effective-v1"'),
              ('nedbetalingstid-boliglan.html','data-rate-authority="term-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
              assert 'sjekk/boliglan/' in html,(page,'commercial handoff')
          for page in ['boliglan.html','boliglan-guider.html','guider.html']:
              assert 'data-rate-authority-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('guide-mellomfinansiering.html','data-housing-intent="bridge-v1"'),
              ('oke-boliglanet.html','data-housing-intent="increase-v1"'),
              ('rammelan-bolig.html','data-housing-intent="creditline-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
              assert 'sjekk/boliglan/' in html,(page,'commercial handoff')
          relief=Path('guide-avdragsfrihet.html').read_text(encoding='utf-8')
          assert 'data-housing-intent="payment-relief-v1"' in relief
          assert 'betalingsproblemer-hva-gjor-jeg.html' in relief
          for page in ['boliglan.html','boliglan-guider.html','guider.html']:
              assert 'data-housing-intent-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          for page,marker in [
              ('gjeldsregisteret-forbrukslan.html','data-debt-search-revenue="overview-v1"'),
              ('refinansiere-forbruksgjeld.html','data-debt-search-revenue="refi-credit-v1"'),
              ('samle-smalan-kredittkortgjeld.html','data-debt-search-revenue="consolidate-v1"')]:
              html=Path(page).read_text(encoding='utf-8')
              assert marker in html,(page,marker)
          assert 'sjekk/forbrukslan/?intent=refinansiere' in Path('refinansiere-forbruksgjeld.html').read_text(encoding='utf-8')
          assert 'sjekk/forbrukslan/?intent=refinansiere' in Path('samle-smalan-kredittkortgjeld.html').read_text(encoding='utf-8')
          for page in ['forbrukslan.html','forbrukslan-guider.html','kredittkort.html','kredittkort-guider.html']:
              assert 'data-debt-search-revenue-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          capacity=Path('hvor-mye-kan-jeg-lane-bolig.html').read_text(encoding='utf-8')
          assert 'data-borrowing-capacity="v1"' in capacity
          assert 'sjekk/boliglan/' in capacity
          assert 'mangler-egenkapital-bolig.html' in capacity
          assert 'belaningsgrad-sjekk.html' in capacity
          for page in ['boliglan.html','boliglan-guider.html','guider.html']:
              assert 'data-borrowing-capacity-link="v1"' in Path(page).read_text(encoding='utf-8'),page
          bank_switch_pages={
              'bytte-bank-boliglan-komplett.html':'decision-v1',
              'flytte-boliglan.html':'transfer-v1',
              'guide-bytte-bank-steg.html':'fullmove-v1',
              'guide-sammenligne-boliglan.html':'compare-v1',
          }
          for page,marker in bank_switch_pages.items():
              html=Path(page).read_text(encoding='utf-8')
              assert f'data-bank-switch-consolidation="{marker}"' in html,page
              assert 'sjekk/boliglan/' in html,page
          equity_pages={
              'boliglan-uten-egenkapital.html':'gap-v2',
              'kausjonist-boliglan.html':'guarantor-v2',
              'medlantaker-boliglan.html':'coborrower-v2',
              'egenkapital-bolig.html':'capital-v2',
          }
          for page,marker in equity_pages.items():
              html=Path(page).read_text(encoding='utf-8')
              assert f'data-equity-search-revenue="{marker}"' in html,page
              assert 'sjekk/boliglan/' in html,page
          rate_revenue_pages={
              'boliglansrente-komplett-guide.html':'rate-v2',
              'guide-forhandle-rente.html':'negotiate-v2',
              'slik-far-du-bedre-boliglansrente.html':'better-rate-v2',
              'guide-effektiv-nominell-rente.html':'terms-v2',
          }
          for page,marker in rate_revenue_pages.items():
              html=Path(page).read_text(encoding='utf-8')
              assert f'data-rate-search-revenue="{marker}"' in html,page
              assert 'sjekk/boliglan/' in html,page
          secured_refi_pages={
              'refinansiering-med-sikkerhet.html':'secured-v2',
              'omstartslan.html':'omstart-v2',
          }
          for page,marker in secured_refi_pages.items():
              html=Path(page).read_text(encoding='utf-8')
              assert f'data-secured-refi-revenue="{marker}"' in html,page
              assert 'sjekk/omstartslan/' in html,page
          housing_product_pages={
              'guide-mellomfinansiering.html':'bridge-v2',
              'rammelan-bolig.html':'creditline-v2',
              'oke-boliglanet.html':'increase-v2',
          }
          for page,marker in housing_product_pages.items():
              html=Path(page).read_text(encoding='utf-8')
              assert f'data-housing-product-revenue="{marker}"' in html,page
              assert 'sjekk/boliglan/' in html,page
          matcher=Path('tools/apply_revenue_matcher.py').read_text(encoding='utf-8')
          assert "'utfordringer':['Okida','GjeldsMegleren Norge','Zen Finans','Tjenestetorget']" in matcher
          cc=Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8')
          assert 'data-partner="Zensum"' in cc and 'ANNONSE / REKLAME' in cc
          bank_roles={
              'bytte-bank-boliglan-komplett.html':'decision',
              'flytte-boliglan.html':'mortgage-transfer',
              'guide-bytte-bank-steg.html':'full-bank-move',
              'guide-bytte-bank.html':'trigger',
          }
          for page,role in bank_roles.items():
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              assert s.body.get('data-search-intent')==role,(page,role)
              assert s.title and s.find('h1'),page
          print('Revenue Engine pass 10 + Traffic Engine conversion batch PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 on tracked site pages
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          publisher_assets={
              'bygg-inn-rentekalkulator.html','bygg-inn-gjeldsrente-sjekk.html',
              'bygg-inn-valutapaslag-kalkulator.html','bygg-inn-kredittkort-minstebelop.html',
              'betalingsproblemer-hva-gjor-jeg.html'
          }
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts and 'embed' not in p.parts and p.name not in publisher_assets]
          missing=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing, missing
          for name in publisher_assets:
              assert Path(name).exists(),name
          print('GA4 PASS; embed/publisher Traffic Engine assets intentionally excluded from legacy GA4 invariant')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Traffic Capture generated outputs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
