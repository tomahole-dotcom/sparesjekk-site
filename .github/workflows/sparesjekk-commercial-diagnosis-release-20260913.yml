name: Sparesjekk V39 Routing Commercial Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V39 routing-commercial QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify V39 presentation layer
        shell: python
        run: |
          from pathlib import Path
          css=Path('design-v39.css').read_text(encoding='utf-8')
          for token in ['SEO-neutral refinement','.problem-grid','.campaign-page .campaign-shell','.partner-preview']:
              assert token in css, token
          builder=Path('tools/build_site.py').read_text(encoding='utf-8')
          assert "design_names=['design-v36.css','design-v37.css','design-v38.css','design-v39.css']" in builder
          print('V39 routing + commercial presentation PASS')
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build presentation layers
        run: python tools/build_site.py
      - name: Verify V39 on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          layers=['design-v36.css','design-v37.css','design-v38.css','design-v39.css']
          pages=[p for p in Path('.').rglob('*.html') if not any(part.startswith('.') for part in p.parts) and 'tools' not in p.parts]
          missing=[]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if not all(x in s for x in layers): missing.append(str(p))
          assert not missing, missing[:25]
          print(f'V36-V39 applied to {len(pages)} pages')
      - name: Verify routing and commercial content preserved
        shell: python
        run: |
          from pathlib import Path
          router=Path('problemloser.html').read_text(encoding='utf-8')
          for token in ['Hva prøver du å løse akkurat nå?','Jeg har mange smålån og kredittkort','Jeg får ikke betalt regningene','rel="canonical"','robots']:
              assert token in router,token
          for f in ['sjekk/boliglan/index.html','sjekk/forbrukslan/index.html','sjekk/omstartslan/index.html','sjekk/kredittkort/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              for token in ['ANNONSE / REKLAME','rel="canonical"','robots','partner-preview']:
                  assert token in s,(f,token)
          print('Problem routing + commercial content/SEO preserved PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          missing_ga=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing_ga, missing_ga[:20]
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for u in ['problemloser.html','sjekk/boliglan/','sjekk/forbrukslan/','sjekk/omstartslan/','sjekk/kredittkort/']:
              assert 'https://sparesjekk.no/'+u in sm, u
          print('GA4 + sitemap PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply V39 routing and commercial visual layer'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
