name: Sparesjekk Homepage Visual QA Release 20260913

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run homepage visual QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Verify homepage visual system
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'class="visual-hero"',
            'class="hero-photo"',
            'Få bedre kontroll på pengene dine',
            'class="topic-grid"',
            'Sjekk økonomien din',
            'min-rente-vs-markedet.html',
            'gjeldsmiks-sjekk.html',
            'kredittkort-match.html'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          assert '@media(max-width:900px)' in s
          assert '@media(max-width:560px)' in s
          assert 'images.pexels.com' in s
          print('Homepage visual system + responsive rules PASS')
      - name: Normalize internal HTML links
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          query_pat=re.compile(r'href=("|\')([^"\']+\.html)\?v=\d+(#[^"\']*)?\1')
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=query_pat.sub(lambda m: f'href={m.group(1)}{m.group(2)}{m.group(3) or ""}{m.group(1)}',s)
              s=s.replace('http://sparesjekk.no/','https://sparesjekk.no/')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Normalized files:',len(changed))
      - name: Verify key conversion paths
        shell: python
        run: |
          from pathlib import Path
          debt=Path('gjeldsmiks-sjekk.html').read_text(encoding='utf-8')
          card=Path('kredittkort-match.html').read_text(encoding='utf-8')
          assert 'Hva kan lavere rente bety?' in debt
          assert 'Hvilket kredittkort passer måten du bruker kort på?' in card
          assert 'partners' in Path('site-config.json').read_text(encoding='utf-8')
          print('Key diagnosis paths PASS')
      - name: Refresh baseline and build site
        run: |
          python tools/seo_guard.py snapshot
          python tools/build_site.py
          python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4 and sitemap
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=list(Path('.').rglob('*.html'))
          missing=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          assert not missing, missing
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for u in ['gjeldsmiks-sjekk.html','kredittkort-match.html','forbrukslan.html','kredittkort.html']:
              assert 'https://sparesjekk.no/'+u in sm, u
          print(f'GA4 + sitemap PASS: {len(pages)} pages')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize homepage visual release outputs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
