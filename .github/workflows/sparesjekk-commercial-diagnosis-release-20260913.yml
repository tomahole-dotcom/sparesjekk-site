name: Sparesjekk V45 GSC Internal Link Release 20260913
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-commercial-diagnosis-release-20260913.yml']
permissions:
  contents: write
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    if: contains(github.event.head_commit.message, 'Run V45 GSC internal-link QA and production release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO before build
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Apply Revenue Engine layers
        run: |
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
          python tools/apply_revenue_matcher.py
          python tools/apply_revenue_handoff.py
          python tools/apply_revenue_tracking.py
      - name: Verify Revenue Engine pass 7
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          routes={'refinansiering-kalkulator.html':('sjekk/forbrukslan/?intent=refinansiere','refinance_calculator_result'),'gjeldsmiks-sjekk.html':('sjekk/forbrukslan/?intent=refinansiere','debt_mix_result'),'omstartslan.html':('sjekk/omstartslan/?intent=sikkerhet','restart_loan_guide'),'refinansiering-med-sikkerhet.html':('sjekk/omstartslan/?intent=sikkerhet','secured_refinance_guide')}
          for page,(href,ctx) in routes.items():
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              links=[a for a in s.select('a[data-revenue-event="commercial_route"]') if a.get('href')==href]
              assert links,(page,href)
              assert any(a.get('data-revenue-context') for a in links),page
          for page,n in [('sjekk/forbrukslan/index.html',3),('sjekk/omstartslan/index.html',4)]:
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              root=s.select_one('[data-revenue-matcher="v1"][data-allowed-intents]'); assert root,page
              assert len(root.select('button[data-match][data-revenue-event="matcher_choice"]'))==n,page
              h=s.find('script',attrs={'data-revenue-handoff-script':'v1'}); assert h,page
              code=h.string or ''; assert 'URLSearchParams' in code and 'history.replaceState' in code and 'matcher_handoff' in code,page
              t=s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'}); assert t and 'revenue_context' in (t.string or ''),page
          print('Revenue Engine pass 7 PASS')
      - name: Verify approved partner matrix
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          expected={'sjekk/forbrukslan/index.html':{'Zensum':'https://go.adt256.com/t/t?a=1638602458&as=2102543040&t=2&tk=1','Sambla':'https://go.adt246.net/t/t?a=1923319888&as=2102543040&t=2&tk=1','DigiFinans':'https://go.adt231.net/t/t?a=1923321285&as=2102543040&t=2&tk=1','Tjenestetorget':'https://go.adt253.net/t/t?a=1578043594&as=2102543040&t=2&tk=1'},'sjekk/omstartslan/index.html':{'Okida':'https://at.okida.no/t/t?a=1259715125&as=2102543040&t=2&tk=1','Zen Finans':'https://ion.zenfinans.no/t/t?a=2103897882&as=2102543040&t=2&tk=1','GjeldsMegleren Norge':'https://at.gjeldsmeglerennorge.no/t/t?a=2069312844&as=2102543040&t=2&tk=1','Tjenestetorget':'https://go.adt253.net/t/t?a=1578044122&as=2102543040&t=2&tk=1'}}
          for page,partners in expected.items():
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser'); cards={c.get('data-partner'):c for c in s.select('.partner-card')}; assert set(cards)==set(partners)
              for name,url in partners.items():
                  a=cards[name].select_one('a.partner-cta'); assert a.get('href')==url
                  assert a.get('data-revenue-event')=='partner_click' and a.get('data-revenue-partner')==name
                  assert {'sponsored','nofollow','noopener'} <= set(a.get('rel') or [])
          print('Partner matrix PASS')
      - name: Full SEO guard after build
        run: python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Verify GA4
        shell: python
        run: |
          from pathlib import Path
          import json
          ga4=json.loads(Path('site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=[p for p in Path('.').rglob('*.html') if 'tools' not in p.parts]
          assert not [str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          print('GA4 PASS')
      - name: Commit tested generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'sjekk/**/*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Revenue Engine pass 7 generated outputs'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
# release trigger: Revenue Engine pass 7 contextual handoff 2026-09-16
