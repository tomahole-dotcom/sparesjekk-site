name: Sparesjekk V35 Finalize Guides + QA

on:
  push:
    branches:
      - seo-content-v34-master
    paths:
      - .github/workflows/sparesjekk-v35-finalize-guides-qa-20260910.yml

permissions:
  contents: write

concurrency:
  group: sparesjekk-v35-finalize-guides-qa
  cancel-in-progress: false

jobs:
  finalize-guides-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V34/V35 branch
        uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt

      - name: Dependencies
        run: pip install -r requirements-site-builder.txt

      - name: Attach V35 to remaining guide indexes
        shell: python
        run: |
          from pathlib import Path
          targets = ['guider.html', 'boliglan-guider.html']
          old = '<link href="style.css?v=25" rel="stylesheet"/>'
          new = old + '<link href="design-v35.css" rel="stylesheet"/>'
          for name in targets:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'design-v35.css' in text:
                  print(f'{name}: V35 already attached')
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one stylesheet anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{name}: V35 attached')

      - name: SEO Guard
        run: python tools/seo_guard.py check

      - name: Build generated blocks and sitemap for QA
        run: python tools/build_site.py

      - name: Full QA
        run: python tools/qa_site.py

      - name: Verify GA4 on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          import json, sys
          root=Path('.')
          ga4=json.loads((root/'site-config.json').read_text(encoding='utf-8'))['site']['ga4']
          pages=list(root.rglob('*.html'))
          missing=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          if missing:
              print('GA4 missing:', *missing, sep='\n- ')
              sys.exit(1)
          print(f'GA4 PASS: {len(pages)} pages')

      - name: Verify FX sitemap consolidation
        shell: python
        run: |
          from pathlib import Path
          import sys
          s=Path('sitemap.xml').read_text(encoding='utf-8')
          old='https://sparesjekk.no/kredittkort-valutapaslag.html'
          new='https://sparesjekk.no/valutapaslag-kredittkort.html'
          if old in s:
              print('Deprecated FX URL is still in sitemap')
              sys.exit(1)
          if new not in s:
              print('Canonical FX URL missing from sitemap')
              sys.exit(1)
          print('FX sitemap consolidation PASS')

      - name: Commit only final V35 guide attachments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guider.html boliglan-guider.html
          if git diff --cached --quiet; then
            echo 'No guide attachment changes to commit'
          else
            git commit -m 'Attach V35 design to remaining guide indexes [skip ci]'
            git push origin HEAD:seo-content-v34-master
          fi
