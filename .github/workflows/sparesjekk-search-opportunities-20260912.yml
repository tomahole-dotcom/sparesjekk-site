name: Sparesjekk Search Opportunity Batch 20260912

on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/sparesjekk-search-opportunities-20260912.yml']

permissions:
  contents: write

concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false

jobs:
  optimize-qa-deploy:
    if: contains(github.event.head_commit.message, 'Run consolidated Sparesjekk search opportunity batch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Apply search-opportunity improvements
        shell: python
        run: |
          from pathlib import Path

          p=Path('rentemote-hva-betyr-det.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Rentepuls: styringsrente og boliglånsrente | Sparesjekk</title>', '<title>Rentemøte 24. september 2026: rente og boliglån | Sparesjekk</title>', 1)
          s=s.replace('content="Følg styringsrenten og gjennomsnittlig boliglånsrente i Norge, og se hva renteendringer betyr i kroner for boliglånet." name="description"', 'content="Neste rentemøte er 24. september 2026. Følg styringsrenten, boliglånsrentene og se hva en renteendring kan bety i kroner." name="description"', 1)
          s=s.replace('<h1>Styringsrente og boliglånsrente – hva skjer med lånet ditt?</h1>', '<h1>Rentemøte 24. september 2026 – hva kan det bety for boliglånet?</h1>', 1)
          marker='<section><h2>Rentepuls akkurat nå</h2>'
          intro='<section><h2>Neste rentemøte: 24. september 2026</h2><p>Norges Banks neste rentebeslutning er 24. september 2026. Et rentemøte avgjør styringsrenten, men bankenes boliglånsrenter trenger ikke endres like mye eller samtidig. Derfor følger Sparesjekk både styringsrenten og SSBs faktiske gjennomsnittsrenter på boliglån.</p><p>Etter rentebeslutningen oppdateres denne siden med utfallet og hva det kan bety i kroner. Dagen etter, 25. september, er neste planlagte SSB-oppdatering av bankrentene.</p></section>'
          assert marker in s
          if 'Neste rentemøte: 24. september 2026' not in s:
              s=s.replace(marker, intro+marker, 1)
          p.write_text(s, encoding='utf-8')

          p=Path('cashback-bonus-kredittkort.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Cashback og bonus på kredittkort – når har det verdi? | Sparesjekk</title>', '<title>Kredittkort med bonus og cashback – når lønner det seg? | Sparesjekk</title>', 1)
          s=s.replace('<h1>Cashback og bonus på kredittkort – når har det verdi?</h1>', '<h1>Kredittkort med bonus og cashback – når har det verdi?</h1>', 1)
          s=s.replace('content="Bonus og cashback kan gi fordeler, men bør vurderes mot renter, gebyrer, begrensninger og hvordan du faktisk bruker kortet." name="description"', 'content="Vurder kredittkort med bonus og cashback mot renter, gebyrer, bonusgrenser og faktisk bruk. Se når fordelen kan ha reell nettoverdi." name="description"', 1)
          p.write_text(s, encoding='utf-8')

          p=Path('boliglan.html'); s=p.read_text(encoding='utf-8')
          old='<a href="rentemote-hva-betyr-det.html">Rentepuls →</a>'
          new='<a href="rentemote-hva-betyr-det.html">Neste rentemøte 24. september →</a>'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')

          p=Path('kredittkort.html'); s=p.read_text(encoding='utf-8')
          if 'href="cashback-bonus-kredittkort.html"' not in s:
              marker='href="kredittkort-rentefri-periode.html"'
              pos=s.find(marker)
              assert pos >= 0
              end=s.find('</a>',pos)
              assert end >= 0
              end += 4
              s=s[:end]+' · <a href="cashback-bonus-kredittkort.html">Kredittkort med bonus og cashback →</a>'+s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Verify target changes
        shell: python
        run: |
          from pathlib import Path
          a=Path('rentemote-hva-betyr-det.html').read_text(encoding='utf-8')
          b=Path('cashback-bonus-kredittkort.html').read_text(encoding='utf-8')
          c=Path('boliglan.html').read_text(encoding='utf-8')
          d=Path('kredittkort.html').read_text(encoding='utf-8')
          assert 'Rentemøte 24. september 2026' in a
          assert 'Kredittkort med bonus og cashback' in b
          assert 'Neste rentemøte 24. september' in c
          assert 'cashback-bonus-kredittkort.html' in d
          print('Search opportunity batch PASS')
      - name: Refresh baseline and build sitemap
        run: |
          python tools/seo_guard.py snapshot
          python tools/build_site.py
          python tools/seo_guard.py snapshot
      - name: Full QA
        run: python tools/qa_site.py
      - name: Commit tested outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sitemap.xml seo-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m 'Target near-ranking finance search opportunities'
            git push origin HEAD:seo-content-v34-master
          fi
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
