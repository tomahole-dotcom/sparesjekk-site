name: Revenue Engine Pass 5 QA
on:
  push:
    branches: [revenue-engine-pass-5-20260916]
    paths: ['.github/workflows/revenue-engine-pass-5-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt
      - run: pip install -r requirements-site-builder.txt
      - name: Snapshot SEO
        run: python tools/seo_guard.py snapshot
      - name: Build site
        run: python tools/build_site.py
      - name: Preserve result Revenue transforms
        run: |
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
      - name: Apply pass 5 result tracking
        run: |
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
      - name: Verify pass 5 result CTAs
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          checks=[
            ('gjeldsmiks-sjekk.html','#result #commercialCta','sjekk/forbrukslan/','debt_mix_result'),
            ('min-rente-vs-markedet.html','#result #commercialCta','sjekk/boliglan/','mortgage_rate_benchmark_result'),
          ]
          for page,sel,href,ctx in checks:
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              c=s.select_one(sel)
              assert c,(page,sel)
              assert c.get('href')==href,(page,c.get('href'))
              assert c.get('data-revenue-event')=='commercial_route',page
              assert c.get('data-revenue-context')==ctx,(page,c.get('data-revenue-context'))
              assert c.find_parent(id='result'),page
          print('Pass 5 result CTAs PASS')
      - name: Apply Revenue tracking
        run: python tools/apply_revenue_tracking.py
      - name: Verify tracking instrumentation and context
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          for page in ['gjeldsmiks-sjekk.html','min-rente-vs-markedet.html']:
              s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
              tag=s.find('script',attrs={'data-sparesjekk-revenue-tracking':'v1'})
              assert tag,page
              assert 'revenue_context' in (tag.string or ''),page
          print('Revenue tracking context PASS')
      - name: Verify approved partner matrix
        shell: python
        run: |
          import json
          from pathlib import Path
          cfg=json.loads(Path('site-config.json').read_text(encoding='utf-8'))
          expected={
            'Sambla':'https://go.adt246.net/t/t?a=1923319888&as=2102543040&t=2&tk=1',
            'DigiFinans':'https://go.adt231.net/t/t?a=1923321285&as=2102543040&t=2&tk=1',
            'Okida':'https://at.okida.no/t/t?a=1259715125&as=2102543040&t=2&tk=1',
            'Zen Finans':'https://ion.zenfinans.no/t/t?a=2103897882&as=2102543040&t=2&tk=1',
            'GjeldsMegleren Norge':'https://at.gjeldsmeglerennorge.no/t/t?a=2069312844&as=2102543040&t=2&tk=1',
          }
          for name,url in expected.items():
              matches=[p for p in cfg['partners'] if p['name']==name]
              assert len(matches)==1,name
              p=matches[0]
              assert p['approved'] and p['status']=='active' and p['tracking_verified'],name
              assert p['url']==url,name
          print('Approved partner matrix PASS')
      - name: SEO guard
        run: python tools/seo_guard.py snapshot
      - name: Full site QA
        run: python tools/qa_site.py
