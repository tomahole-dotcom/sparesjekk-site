name: Sparesjekk Site Release V30

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after all QA gates pass'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'site-config.json'
      - 'tools/**'
      - '**.html'
      - 'style.css'
      - 'script.js'
      - 'robots.txt'
      - '.htaccess'
      - 'seo-baseline.json'

permissions:
  contents: read

concurrency:
  group: sparesjekk-site-release
  cancel-in-progress: false

jobs:
  build-qa-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-site-builder.txt

      - name: Dependencies
        run: pip install -r requirements-site-builder.txt

      - name: Build generated commercial blocks and sitemap
        run: python tools/build_site.py

      - name: Full QA and SEO hard gate
        run: python tools/qa_site.py

      - name: Verify GA4 on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          import json, sys
          root=Path('.')
          ga4=json.loads((root/'site-config.json').read_text())['site']['ga4']
          pages=list(root.rglob('*.html'))
          missing=[str(p) for p in pages if ga4 not in p.read_text(encoding='utf-8')]
          if missing:
              print('GA4 missing:', *missing, sep='\n- ')
              sys.exit(1)
          print(f'GA4 PASS: {len(pages)} pages')

      - name: Create deploy package
        run: |
          mkdir -p release
          rsync -a ./ release/site/ \
            --exclude '.git/' --exclude '.github/' --exclude 'release/' \
            --exclude 'tools/' --exclude 'seo-baseline.json' \
            --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
          (cd release/site && zip -qr ../sparesjekk-site-release.zip .)

      - name: Upload tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparesjekk-tested-site
          path: release/sparesjekk-site-release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Deploy gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SPARESJEKK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SPARESJEKK_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.SPARESJEKK_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.SPARESJEKK_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            [ -n "${!v:-}" ] || { echo "Missing required deploy secret: $v"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.well-known/' \
            release/site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
