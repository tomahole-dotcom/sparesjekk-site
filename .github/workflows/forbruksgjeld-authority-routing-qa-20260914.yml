name: Forbruksgjeld Authority Routing QA 20260914
on:
  push:
    branches: [forbruksgjeld-authority-routing-20260914]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r requirements-site-builder.txt
      - name: Strengthen contextual forbruksgjeld routing
        shell: python
        run: |
          from pathlib import Path
          p=Path('gjeldsregisteret-forbrukslan.html')
          s=p.read_text(encoding='utf-8')
          old='<a href="refinansiere-forbruksgjeld.html">Refinansiering →</a>'
          new='<a href="refinansiere-forbruksgjeld.html">Har du dyr forbruksgjeld? Se hvordan du vurderer refinansiering →</a>'
          assert old in s
          s=s.replace(old,new,1)
          marker='<p>Lavere terminbeløp kan se attraktivt ut, men en lengre nedbetalingstid kan samtidig gjøre at du betaler renter over flere år. Derfor bør både effektiv rente, gebyrer, løpetid og total tilbakebetaling inngå i vurderingen.</p>'
          assert marker in s
          extra=marker+'<p>Har oversikten avdekket dyr forbruksgjeld, bør neste steg være å vurdere om refinansiering faktisk reduserer kostnaden. <a href="refinansiere-forbruksgjeld.html">Sammenlign forbruksgjelden før og etter refinansiering →</a></p>'
          s=s.replace(marker,extra,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify focused routing
        shell: python
        run: |
          from pathlib import Path
          s=Path('gjeldsregisteret-forbrukslan.html').read_text(encoding='utf-8')
          assert s.count('refinansiere-forbruksgjeld.html') >= 2
          assert 'Har du dyr forbruksgjeld?' in s
          assert 'Sammenlign forbruksgjelden før og etter refinansiering' in s
      - name: SEO guard before build
        run: python tools/seo_guard.py check
      - name: Full QA before build
        run: python tools/qa_site.py
      - name: Build
        run: python tools/build_site.py
      - name: Verify routing after build
        shell: python
        run: |
          from pathlib import Path
          s=Path('gjeldsregisteret-forbrukslan.html').read_text(encoding='utf-8')
          assert 'Har du dyr forbruksgjeld?' in s
          assert 'Sammenlign forbruksgjelden før og etter refinansiering' in s
      - name: SEO guard after build
        run: python tools/seo_guard.py check
      - name: Full QA after build
        run: python tools/qa_site.py
      - name: Commit routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gjeldsregisteret-forbrukslan.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Strengthen forbruksgjeld internal routing'
            git push origin HEAD:forbruksgjeld-authority-routing-20260914
          fi