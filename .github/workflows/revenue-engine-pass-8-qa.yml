name: Revenue Engine Pass 8 QA
on:
  push:
    branches: [revenue-engine-pass-8-20260916]
    paths: ['.github/workflows/revenue-engine-pass-8-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip', cache-dependency-path: requirements-site-builder.txt}
      - run: pip install -r requirements-site-builder.txt
      - run: python tools/seo_guard.py snapshot
      - name: Build complete Revenue Engine
        run: |
          python tools/build_site.py
          python tools/apply_revenue_conversion.py
          python tools/apply_mortgage_result_revenue_cta.py
          python tools/apply_debt_mix_revenue_tracking.py
          python tools/apply_rate_benchmark_revenue_tracking.py
          python tools/apply_revenue_matcher.py
          python tools/apply_revenue_handoff.py
          python tools/apply_revenue_choice_ux.py
          python tools/apply_revenue_tracking.py
      - name: Verify decision-ready UX
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          for page in ['sjekk/forbrukslan/index.html','sjekk/omstartslan/index.html']:
            s=BeautifulSoup(Path(page).read_text(encoding='utf-8'),'html.parser')
            assert s.select_one('.revenue-choice-header h2').get_text(strip=True)=='Aktuelle alternativer'
            cards=s.select('.partner-card[data-partner]'); assert len(cards)==4
            for c in cards:
              name=c['data-partner']; a=c.select_one('a.partner-cta[data-revenue-stage="partner_outclick"]'); assert a
              assert a.get_text(' ',strip=True)==f'Gå videre til {name} →'
              assert c.select_one('.revenue-card-kicker') and c.select_one('.revenue-card-action-note')
              assert {'sponsored','nofollow','noopener'} <= set(a.get('rel') or [])
            assert s.find('style',attrs={'data-revenue-choice-style':'v1'})
            assert 'revenue-choice-status' in (s.find('script',attrs={'data-revenue-matcher-script':'v1'}).string or '')
          print('Decision-ready UX PASS')
      - run: python tools/seo_guard.py snapshot
      - run: python tools/qa_site.py
