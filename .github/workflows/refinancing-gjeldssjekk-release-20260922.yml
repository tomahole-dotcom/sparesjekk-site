name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-65-tilbudssjekk-ui-v2
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: seo-content-v34-master}
      - name: Apply targeted UI assets
        shell: python
        run: |
          from pathlib import Path
          additions={
            'refinansiering-kalkulator.html':'<link href="/refinansiering-kalkulator-ui-v2.css?v=20260924" rel="stylesheet"/>',
            'tilbudssjekk-refinansiering.html':'<link href="/tilbudssjekk-ui-v2.css?v=20260924b" rel="stylesheet"/>'}
          for fn,tag in additions.items():
              p=Path(fn); z=p.read_text(encoding='utf-8'); name=tag.split('href="/')[1].split('?')[0]
              if name not in z:
                  assert '</head>' in z; p.write_text(z.replace('</head>',tag+'</head>',1),encoding='utf-8')
      - name: Verify targeted form fixes
        shell: python
        run: |
          from pathlib import Path
          z=Path('tilbudssjekk-refinansiering.html').read_text(encoding='utf-8'); c=Path('tilbudssjekk-ui-v2.css').read_text(encoding='utf-8')
          assert z.count('tilbudssjekk-ui-v2.css')==1
          assert 'flex-direction:column!important' in c and '.offer-panel .field label' in c
          for x in ('debt','currentRate','currentMonths','currentPayment','offerRate','offerMonths','setupFee','monthlyFee','checkOffer'): assert ('id="'+x+'"') in z
          print('Tilbudssjekken UI V2 QA PASS')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
