name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-64-refinansiering-kalkulator-ui-v2
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - name: Apply visual cleanup assets
        shell: python
        run: |
          from pathlib import Path
          tag='<link href="/site-visual-cleanup-v2.css?v=20260924" rel="stylesheet"/>'
          for fn in ('boliglan.html','forbrukslan.html','kredittkort.html','omstartslan.html'):
              p=Path(fn); z=p.read_text(encoding='utf-8')
              if 'site-visual-cleanup-v2.css' not in z:
                  assert '</head>' in z; p.write_text(z.replace('</head>',tag+'</head>',1),encoding='utf-8')
          p=Path('refinansiering-kalkulator.html'); z=p.read_text(encoding='utf-8')
          rtag='<link href="/refinansiering-kalkulator-ui-v2.css?v=20260924" rel="stylesheet"/>'
          if 'refinansiering-kalkulator-ui-v2.css' not in z:
              assert '</head>' in z; p.write_text(z.replace('</head>',rtag+'</head>',1),encoding='utf-8')
      - name: Verify calculator and critical fixes
        shell: python
        run: |
          from pathlib import Path
          calc=Path('refinansiering-kalkulator.html').read_text(encoding='utf-8'); css=Path('refinansiering-kalkulator-ui-v2.css').read_text(encoding='utf-8')
          assert calc.count('refinansiering-kalkulator-ui-v2.css')==1
          assert '.debt-row' in css and '.offer-grid' in css and 'minmax(0,1.35fr)' in css
          for x in ('d1b','d1r','d1m','nr','nm','calc'): assert ('id="'+x+'"') in calc
          debt=Path('gjeldssjekk.html').read_text(encoding='utf-8'); assert 'gjeldssjekk-ui-v2.css' in debt
          credit=Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8'); assert 'remember-gold-med-hvit-kant.png' in credit and 'remember-black-med-hvit-kant.png' in credit
          print('Refinansiering calculator UI V2 QA PASS')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
