name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-66-nav-stability
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: seo-content-v34-master}
      - name: Apply navigation stability globally
        shell: python
        run: |
          from pathlib import Path
          tag='<link href="/nav-stability-v1.css?v=20260924" rel="stylesheet"/>'
          changed=0
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              z=p.read_text(encoding='utf-8')
              if 'class="topnav"' in z and 'nav-stability-v1.css' not in z and '</head>' in z:
                  p.write_text(z.replace('</head>',tag+'</head>',1),encoding='utf-8'); changed+=1
          print('nav pages updated',changed)
      - name: Verify navigation
        shell: python
        run: |
          from pathlib import Path
          css=Path('nav-stability-v1.css').read_text(encoding='utf-8')
          assert '.topnav a:nth-child(n)' in css and '.topnav.open' in css
          pages=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              z=p.read_text(encoding='utf-8')
              if 'class="topnav"' in z:
                  pages.append(str(p)); assert 'nav-stability-v1.css' in z
                  assert 'problemloser.html' in z, f'Problemløser missing in {p}'
          assert pages
          print('Navigation QA PASS',len(pages),'pages')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
