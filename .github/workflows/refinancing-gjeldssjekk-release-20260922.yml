name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-53-boliglan-cta-fix
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - name: Verify boliglån CTA hotfix
        shell: python
        run: |
          from pathlib import Path
          p=Path('sjekk/boliglan/index.html')
          z=p.read_text(encoding='utf-8')
          assert z.count('data-partner="Tjenestetorget"')==1
          assert z.count('1578043389')==1
          assert 'Innhent og sammenlign boliglånstilbud →' in z
          assert 'background:#0b4f91!important' in z
          assert 'color:#fff!important' in z
          assert 'display:block!important' in z
          assert z.count('data-rate-hike-conversion="20260924"')==1
          assert 'Renten er hevet – er boliglånet ditt fortsatt konkurransedyktig?' in z
          assert z.count('rel="icon"')==1 and '/favicon.svg' in z
          assert 'rel="sponsored nofollow noopener"' in z
          print('Boliglån CTA rendering hotfix QA PASS')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
