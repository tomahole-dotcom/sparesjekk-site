name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-40
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - name: Verify release files
        shell: python
        run: |
          import json
          from pathlib import Path
          required=[
            'gjeldssjekk.html','refinansiere-kredittkortgjeld.html','samle-gjeld.html',
            'refinansiere-smalan.html','bor-jeg-refinansiere.html',
            'sjekk/forbrukslan/index.html','sitemap.xml','index.html','ta-sparesjekken.html','forbrukslan.html','refinansiere-forbruksgjeld.html','kredittkort.html','nedbetaling-kredittkortgjeld.html','samle-smalan-kredittkortgjeld.html','refinansiering-kalkulator.html','gjeldsmiks-sjekk.html','hva-bor-jeg-gjore-med-dyr-gjeld.html'
          ]
          for f in required:
              p=Path(f); assert p.exists() and p.stat().st_size>100, f
          g=Path('gjeldssjekk.html').read_text(encoding='utf-8')
          assert 'G-XYRPP78DJ5' in g
          assert 'origin=' in g
          m=Path('sjekk/forbrukslan/index.html').read_text(encoding='utf-8')
          assert 'url_id=896' in m and 'data-origin-attribution="v1"' in m
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for f in required[:5]:
              assert 'https://sparesjekk.no/'+f in sm, f
          fav=Path('favicon.svg')
          ico=Path('favicon.ico')
          assert fav.exists() and fav.stat().st_size>100, 'favicon.svg'
          assert ico.exists() and ico.stat().st_size>100, 'favicon.ico'
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','release'} for part in p.parts): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              icon_count=s.count('rel="icon"')+s.count("rel='icon'")
              assert icon_count <= 1, f'duplicate favicon tags: {p}'
              if icon_count:
                  assert '/favicon.svg' in s, f'unexpected favicon href: {p}'
          rg=Path('rentegap-indeks.html').read_text(encoding='utf-8')
          assert 'Fast referanse: hva koster 0,10 prosentpoeng?' in rg
          assert 'For medier og nettsteder' in rg
          assert 'data/rentegap.json' in rg
          assert '"@type":"Dataset"' in rg
          hist=json.loads(Path('data/rentegap-history.json').read_text(encoding='utf-8'))
          assert hist['observations'] >= 48
          assert hist['period_end'] >= '2026-07'
          assert len(hist['history']) == hist['observations']
          assert 'data-rentegap-history="v1"' in rg
          assert 'data-rentegap-history-ui="v1"' in rg
          assert 'rentegap-history.json' in rg
          assert 'rentegapInsights' in rg
          assert 'rentegapCitation' in rg
          assert 'Høyeste gap, nye lån' in rg
          assert 'Siterbart datapunkt' in rg
          assert 'temporalCoverage":"2021-09/2026-07"' in rg
          assert 'design-v44.css' in rg
          print('Rentegap history UI QA PASS')
          print('Rentegap history QA PASS', hist['observations'], hist['period_start'], hist['period_end'])
          print('Rentegap link-asset QA PASS')
          print('Favicon QA PASS')
          print('Gjeldssjekk release QA PASS')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
