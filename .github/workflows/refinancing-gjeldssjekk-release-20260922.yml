name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-63-gjeldssjekk-ui-v2
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - name: Apply main hub visual cleanup
        shell: python
        run: |
          from pathlib import Path
          tag='<link href="/site-visual-cleanup-v2.css?v=20260924" rel="stylesheet"/>'
          for fn in ('boliglan.html','forbrukslan.html','kredittkort.html','omstartslan.html'):
              p=Path(fn); z=p.read_text(encoding='utf-8')
              if 'site-visual-cleanup-v2.css' not in z:
                  assert '</head>' in z
                  p.write_text(z.replace('</head>',tag+'</head>',1),encoding='utf-8')
      - name: Verify visual cleanup and Gjeldssjekken V2
        shell: python
        run: |
          from pathlib import Path
          css=Path('site-visual-cleanup-v2.css').read_text(encoding='utf-8')
          assert '.hub-editorial' in css and '.decision-grid' in css
          for fn in ('boliglan.html','forbrukslan.html','kredittkort.html','omstartslan.html'):
              assert Path(fn).read_text(encoding='utf-8').count('site-visual-cleanup-v2.css')==1
          debt=Path('gjeldssjekk.html').read_text(encoding='utf-8')
          debtcss=Path('gjeldssjekk-ui-v2.css').read_text(encoding='utf-8')
          assert debt.count('gjeldssjekk-ui-v2.css')==1
          assert '#gsRows' in debtcss and '.gs-remove' in debtcss and '.gs-links' in debtcss
          assert 'id="gsCalc"' in debt and 'id="gsAdd"' in debt and 'id="gsResult"' in debt
          credit=Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8')
          assert 'remember-gold-med-hvit-kant.png' in credit and 'remember-black-med-hvit-kant.png' in credit
          about=Path('om.html').read_text(encoding='utf-8'); assert 'Sparesjekk kan bruke affiliate- og partnerlenker' in about
          print('Gjeldssjekken UI V2 + critical QA PASS')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
