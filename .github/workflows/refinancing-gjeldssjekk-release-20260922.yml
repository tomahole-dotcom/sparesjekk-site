name: Sparesjekk System Repair Release 20260924
# release-trigger-81-forbrukslan-hierarchy-fix
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: seo-content-v34-master}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install parser
        run: pip install beautifulsoup4==4.14.2
      - name: Apply persistent system repair
        run: |
          python tools/system_repair.py
          python tools/forbrukslan_layout_guard.py
      - name: Regression hard gate
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          errors=[]; nav_pages=0
          required={'/problemloser.html':'Problemløser','/om.html':'Om oss'}
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser'); nav=s.select_one('header.header .topnav')
              if nav:
                  nav_pages+=1; hrefs={a.get('href') for a in nav.find_all('a',href=True)}
                  for href,label in required.items():
                      if href not in hrefs: errors.append(f'{label} missing from nav: {p}')
                  csslinks=[x.get('href') for x in s.find_all('link',href=True) if 'design-v45.css' in x.get('href','')]
                  if csslinks != ['/design-v45.css?v=20260925-r80']: errors.append(f'Cache-safe V45 stylesheet missing/duplicated: {p} {csslinks}')
          home=BeautifulSoup(Path('index.html').read_text(encoding='utf-8'),'html.parser')
          if not home.select_one('[data-current-rate-event="2026-09-24"]'): errors.append('Homepage rate decision missing')
          fast=home.select_one('[data-home-fast-routes="v1"]')
          if not fast: errors.append('Homepage fast conversion routes missing')
          else:
              links={a.get('href') for a in fast.find_all('a',href=True)}
              expected={'/boliglan.html#sammenlign','/sjekk/forbrukslan/?intent=refinansiering&origin=homepage-fast','/sjekk/forbrukslan/?intent=nytt-lan&origin=homepage-fast','/sjekk/kredittkort/#samarbeidspartnere','/ta-sparesjekken.html?src=homepage-fast-help'}
              for href in expected:
                  if href not in links: errors.append(f'Homepage fast route missing: {href}')
              if len(fast.select('.home-fast-card')) != 4: errors.append('Homepage fast route must expose exactly four commercial categories')
          consumer=BeautifulSoup(Path('forbrukslan.html').read_text(encoding='utf-8'),'html.parser')
          if consumer.select('[data-conversion-bridge="forbrukslan-v1"], .consumer-conversion-bridge'): errors.append('Forbrukslan duplicate conversion bridge regression')
          chooser=consumer.select_one('#consumer-hub-intent[data-consumer-hub-intent="v1"]')
          if not chooser: errors.append('Forbrukslan canonical intent chooser missing')
          elif len(chooser.select('.decision-actions > a')) != 3: errors.append('Forbrukslan canonical chooser must have exactly 3 choices')
          if not consumer.select_one('.premium-benefits'): errors.append('Forbrukslan benefits missing')
          if not consumer.select_one('#forbrukslan-hub-guide'): errors.append('Forbrukslan editorial guide missing')
          mortgage=BeautifulSoup(Path('boliglan.html').read_text(encoding='utf-8'),'html.parser'); first=mortgage.select_one('.decision-grid > article:first-child')
          if first and first.find('section',recursive=False): errors.append('Boliglan nested content regression')
          if not mortgage.select_one('.hub-followups[data-layout-repair="20260924"]'): errors.append('Boliglan followups repair missing')
          offer=BeautifulSoup(Path('tilbudssjekk-refinansiering.html').read_text(encoding='utf-8'),'html.parser')
          if not offer.select_one('.offer-check[data-layout-repair="20260924"]'): errors.append('Refinancing offer layout repair missing')
          debt=BeautifulSoup(Path('gjeldssjekk.html').read_text(encoding='utf-8'),'html.parser')
          if not debt.select_one('[data-offer-route="gjeldssjekk-v1"]'): errors.append('Gjeldssjekk offer route missing')
          for filename in ('sjekk/forbrukslan/index.html','sjekk/omstartslan/index.html'):
              doc=BeautifulSoup(Path(filename).read_text(encoding='utf-8'),'html.parser'); strip=doc.select_one('#samarbeidspartnere[data-partner-visibility="v1"]')
              if not strip: errors.append(f'Partner visibility/anchor missing: {filename}')
              hero=doc.select_one('.campaign-hero .hero-actions')
              if not hero or not hero.find('a',href='#samarbeidspartnere'): errors.append(f'Direct hero partner route missing: {filename}')
          credit=BeautifulSoup(Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8'),'html.parser')
          if not credit.select_one('#samarbeidspartnere[data-credit-card-partners]'): errors.append('Credit-card partner zone missing')
          restart=BeautifulSoup(Path('omstartslan.html').read_text(encoding='utf-8'),'html.parser')
          if not restart.select_one('article#omstartslan-hub-guide [data-restart-end-flow="v1"]'): errors.append('Omstartslan consolidated end flow missing')
          if errors: raise SystemExit('\n'.join(errors))
          print('SYSTEM REGRESSION QA PASS',nav_pages,'navigation pages; forbrukslan hierarchy protected')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
