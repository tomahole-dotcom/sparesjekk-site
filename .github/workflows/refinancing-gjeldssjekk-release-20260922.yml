name: Sparesjekk System Repair Release 20260924
# release-trigger-83-belaningsgrad-v2
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: seo-content-v34-master}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install parser
        run: pip install beautifulsoup4==4.14.2
      - name: Apply persistent repairs
        run: |
          python tools/system_repair.py
          python tools/forbrukslan_layout_guard.py
          python tools/category_conversion_routes.py
      - name: Regression hard gate
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup
          errors=[]; nav_pages=0
          required={'/problemloser.html':'Problemløser','/om.html':'Om oss'}
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              s=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser'); nav=s.select_one('header.header .topnav')
              if nav:
                  nav_pages+=1; hrefs={a.get('href') for a in nav.find_all('a',href=True)}
                  for href,label in required.items():
                      if href not in hrefs: errors.append(f'{label} missing from nav: {p}')
              csslinks=[x.get('href') for x in s.find_all('link',href=True) if 'design-v45.css' in x.get('href','')]
              if csslinks != ['/design-v45.css?v=20260925-r82']: errors.append(f'R82 stylesheet missing/duplicated: {p} {csslinks}')
          routes={
            'forbrukslan.html':('[data-consumer-hub-intent="v1"]','/sjekk/forbrukslan/?intent=nytt-lan&origin=forbrukslan-hub'),
            'omstartslan.html':('[data-restart-hub-intent="v1"]','/sjekk/omstartslan/?intent=sikkerhet&origin=omstartslan-hub'),
            'kredittkort.html':('[data-card-hub-intent="v1"]','/sjekk/kredittkort/#samarbeidspartnere')}
          for filename,(selector,href) in routes.items():
              doc=BeautifulSoup(Path(filename).read_text(encoding='utf-8'),'html.parser'); section=doc.select_one(selector)
              if not section: errors.append(f'Canonical chooser missing: {filename}'); continue
              cards=section.select('.decision-actions > a')
              if len(cards)!=3: errors.append(f'Chooser must have exactly 3 choices: {filename}'); continue
              first=cards[0]
              if first.get('href')!=href or first.get('data-direct-conversion')!='v2': errors.append(f'Direct conversion route wrong: {filename}')
              if not first.find('span') or 'samarbeidspartner' not in first.find('span').get_text().lower(): errors.append(f'Direct CTA not explicit: {filename}')
              if doc.select('[data-conversion-bridge]'): errors.append(f'Duplicate conversion bridge regression: {filename}')
          css=Path('design-v45.css').read_text(encoding='utf-8')
          for token in ('.main-category-page .decision-actions>a:first-child','color:#fff!important'):
              if token not in css: errors.append(f'Primary-card contrast guard missing: {token}')
          home=BeautifulSoup(Path('index.html').read_text(encoding='utf-8'),'html.parser')
          if not home.select_one('[data-current-rate-event="2026-09-24"]'): errors.append('Homepage rate decision missing')
          if not home.select_one('[data-home-fast-routes="v1"]'): errors.append('Homepage fast routes missing')
          mortgage=BeautifulSoup(Path('boliglan.html').read_text(encoding='utf-8'),'html.parser')
          first=mortgage.select_one('.decision-grid > article:first-child')
          if first and first.find('section',recursive=False): errors.append('Boliglan nested content regression')
          offer=BeautifulSoup(Path('tilbudssjekk-refinansiering.html').read_text(encoding='utf-8'),'html.parser')
          if not offer.select_one('.offer-check[data-layout-repair="20260924"]'): errors.append('Refinancing layout repair missing')
          debt=BeautifulSoup(Path('gjeldssjekk.html').read_text(encoding='utf-8'),'html.parser')
          if not debt.select_one('[data-offer-route="gjeldssjekk-v1"]'): errors.append('Gjeldssjekk offer route missing')
          for filename in ('sjekk/forbrukslan/index.html','sjekk/omstartslan/index.html'):
              doc=BeautifulSoup(Path(filename).read_text(encoding='utf-8'),'html.parser')
              if not doc.select_one('#samarbeidspartnere[data-partner-visibility="v1"]'): errors.append(f'Partner visibility missing: {filename}')
          credit=BeautifulSoup(Path('sjekk/kredittkort/index.html').read_text(encoding='utf-8'),'html.parser')
          if not credit.select_one('#samarbeidspartnere[data-credit-card-partners]'): errors.append('Credit-card partner zone missing')
          ltv=BeautifulSoup(Path('belaningsgrad-sjekk.html').read_text(encoding='utf-8'),'html.parser')
          if not ltv.select_one('main[data-ltv-layout="v2"]'): errors.append('Belaningsgrad v2 layout missing')
          if not ltv.select_one('[data-ltv-result="v2"]'): errors.append('Belaningsgrad v2 result missing')
          if len(ltv.select('.metrics > .metric')) != 3: errors.append('Belaningsgrad result metrics regression')
          if not ltv.select_one('.next-actions .primary[href="min-rente-vs-markedet.html"]'): errors.append('Belaningsgrad primary next action missing')
          if errors: raise SystemExit('\n'.join(errors))
          print('SYSTEM REGRESSION QA PASS',nav_pages,'navigation pages; category routes + belaningsgrad v2 protected')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
