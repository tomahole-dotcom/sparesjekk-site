name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-54-sitewide-partner-cta-contrast
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-v34-master
      - name: Apply site-wide partner CTA contrast guardrail
        shell: python
        run: |
          from pathlib import Path
          tag='<link href="/partner-cta-hotfix.css?v=20260924" rel="stylesheet">'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')):
                  continue
              z=p.read_text(encoding='utf-8')
              if 'partner-cta' not in z:
                  continue
              if 'partner-cta-hotfix.css' in z:
                  continue
              if '</head>' not in z:
                  raise SystemExit(f'Missing </head> in {p}')
              z=z.replace('</head>',tag+'</head>',1)
              p.write_text(z,encoding='utf-8')
              changed.append(str(p))
          if not changed:
              raise SystemExit('No partner CTA pages patched')
          print('Patched partner CTA pages:', *changed, sep='\n - ')
      - name: Verify site-wide CTA contrast and commercial integrity
        shell: python
        run: |
          from pathlib import Path
          css=Path('partner-cta-hotfix.css').read_text(encoding='utf-8')
          for needle in ('color:#ffffff !important','-webkit-text-fill-color:#ffffff !important','background:#0b4f91 !important','opacity:1 !important','visibility:visible !important'):
              assert needle in css, needle
          pages=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')):
                  continue
              z=p.read_text(encoding='utf-8')
              if 'partner-cta' in z:
                  pages.append((p,z))
                  assert z.count('partner-cta-hotfix.css')==1, p
                  assert 'rel="sponsored nofollow noopener"' in z or 'rel="sponsored' in z, p
          assert pages
          critical=['sjekk/forbrukslan/index.html','sjekk/boliglan/index.html','sjekk/omstartslan/index.html','sjekk/kredittkort/index.html']
          for f in critical:
              p=Path(f); assert p.exists(), f
              z=p.read_text(encoding='utf-8')
              assert 'partner-cta-hotfix.css' in z, f
              assert 'partner-cta' in z, f
          print(f'CTA contrast QA PASS on {len(pages)} partner pages')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
