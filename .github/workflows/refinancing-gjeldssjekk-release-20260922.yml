name: Sparesjekk Gjeldssjekk Release 20260922
# release-trigger-67-nav-content-fix
on:
  push:
    branches: [seo-content-v34-master]
    paths: ['.github/workflows/refinancing-gjeldssjekk-release-20260922.yml']
permissions:
  contents: read
concurrency:
  group: sparesjekk-production-deploy
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: seo-content-v34-master}
      - name: Apply navigation stability and repair missing Problemløser links
        shell: python
        run: |
          from pathlib import Path
          import re
          tag='<link href="/nav-stability-v1.css?v=20260924b" rel="stylesheet"/>'
          changed=0; repaired=0
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              z=p.read_text(encoding='utf-8')
              if 'class="topnav"' not in z: continue
              if 'nav-stability-v1.css' not in z and '</head>' in z:
                  z=z.replace('</head>',tag+'</head>',1); changed+=1
              if 'problemloser.html' not in z:
                  m=re.search(r'(<nav[^>]*class="[^"]*topnav[^"]*"[^>]*>)(.*?)(</nav>)',z,re.S)
                  if m:
                      body=m.group(2)
                      link='<a href="/problemloser.html">Problemløser</a>'
                      anchors=list(re.finditer(r'<a\b[^>]*>.*?</a>',body,re.S))
                      if anchors:
                          # Put Problemløser before the final nav item (normally Tilbudssjekken/Guider), avoiding edge clipping.
                          pos=anchors[-1].start()
                          body=body[:pos]+link+body[pos:]
                      else:
                          body+=link
                      z=z[:m.start(2)]+body+z[m.end(2):]
                      repaired+=1
              p.write_text(z,encoding='utf-8')
          print('nav css added',changed,'missing Problemløser repaired',repaired)
      - name: Verify navigation
        shell: python
        run: |
          from pathlib import Path
          css=Path('nav-stability-v1.css').read_text(encoding='utf-8')
          assert '.topnav a:nth-child(n)' in css and '.topnav.open' in css
          pages=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','release')): continue
              z=p.read_text(encoding='utf-8')
              if 'class="topnav"' in z:
                  pages.append(str(p))
                  assert 'nav-stability-v1.css' in z, f'nav css missing in {p}'
                  assert 'problemloser.html' in z, f'Problemløser missing in {p}'
          assert pages
          print('Navigation QA PASS',len(pages),'pages')
      - name: Create tested release
        run: |
          mkdir -p release/site
          rsync -a ./ release/site/ --exclude '.git/' --exclude '.github/' --exclude 'release/' --exclude 'tools/' --exclude 'seo-baseline.json' --exclude 'requirements-site-builder.txt' --exclude 'site-config.json'
      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.SPARESJEKK_FTP_HOST }}
          FTP_USER: ${{ secrets.SPARESJEKK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
        run: 'set -euo pipefail; for v in FTP_HOST FTP_USER FTP_PASSWORD; do [ -n "${!v:-}" ] || exit 1; done'
      - name: Deploy tested site to production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SPARESJEKK_FTP_HOST }}
          username: ${{ secrets.SPARESJEKK_FTP_USER }}
          password: ${{ secrets.SPARESJEKK_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./release/site/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
