name: Render Rentemote Short
on:
  workflow_dispatch:
  push:
    branches: [seo-content-v34-master]
    paths:
      - 'traffic/rentemote-short-v1.svg'
      - '.github/workflows/render-rentemote-short.yml'
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and SVG renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Render 12-second vertical MP4
        run: |
          mkdir -p rendered
          rsvg-convert -w 1080 -h 1920 traffic/rentemote-short-v1.svg -o rendered/rentemote-short-v1.png
          ffmpeg -y -loop 1 -i rendered/rentemote-short-v1.png -t 12 -r 30 -vf "format=yuv420p" -c:v libx264 -movflags +faststart rendered/rentemote-short-v1.mp4
          ffprobe -v error -show_entries stream=width,height,duration -of default=nw=1 rendered/rentemote-short-v1.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: rentemote-short-v1-mp4
          path: rendered/rentemote-short-v1.mp4
          retention-days: 14
