<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Valutapåslag-kalkulator | Sparesjekk</title><style>body{font-family:system-ui,sans-serif;margin:0;color:#14213d}.w{max-width:560px;padding:18px}.card{border:1px solid #dfe7ef;border-radius:16px;padding:18px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b9c9da;border-radius:9px;font-size:16px}button{margin-top:14px;padding:12px 16px;border:0;border-radius:9px;background:#0d5bd7;color:white;font-weight:800}.r{margin-top:15px;padding:14px;background:#f4f8fc;border-radius:10px}.src{font-size:12px;margin-top:14px;color:#52606d}.src a{color:#0d5bd7}@media(max-width:480px){.g{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="card"><strong>Hva koster valutapåslaget?</strong><p>Se hvor mye kortets prosentvise valutapåslag utgjør på kjøp i utenlandsk valuta.</p><div class="g"><div><label for="amount">Kjøp omregnet til NOK</label><input id="amount" inputmode="numeric" placeholder="10 000"></div><div><label for="fee">Valutapåslag (%)</label><input id="fee" inputmode="decimal" placeholder="1,75"></div></div><button id="calc">Beregn</button><div id="result" class="r" hidden></div><p class="src">Gratis verktøy fra <a href="https://sparesjekk.no/kredittkort-match.html" target="_blank" rel="noopener">Sparesjekk.no</a>. Andre gebyrer, kortnettverkets kurs, DCC og renter er ikke inkludert.</p></div></main><script>function n(v){return Number(String(v).replace(/\s/g,'').replace(',','.'))}document.getElementById('calc').addEventListener('click',()=>{const a=n(document.getElementById('amount').value),f=n(document.getElementById('fee').value),r=document.getElementById('result');if(!(a>0)||!(f>=0&&f<20)){r.hidden=false;r.textContent='Legg inn gyldig beløp og prosent.';return}const c=a*f/100;r.hidden=false;r.innerHTML='<strong>Valutapåslag: '+new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK',maximumFractionDigits:2}).format(c)+'</strong><br>Total etter dette påslaget: '+new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK',maximumFractionDigits:2}).format(a+c)})</script></body></html>
